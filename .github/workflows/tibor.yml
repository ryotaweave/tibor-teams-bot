name: TIBOR Teams notifier

on:
  schedule:
    # The PDF is finalised ~14:00–15:40 JST (observed over many days, latest
    # ~15:39), so 16:00 JST is the earliest safe target. GitHub's cron is
    # best-effort (often delayed, sometimes dropped), so besides the 16:00
    # primary we add catch-ups; the script de-dups by rate date and posts each
    # new rate exactly once. Times are UTC — JST = UTC + 9h.
    - cron: "0 7 * * 1-5"     # 16:00 JST — primary, just after publication
    - cron: "30 7 * * 1-5"    # 16:30 JST — catch-up
    - cron: "30 8 * * 1-5"    # 17:30 JST — catch-up
    - cron: "0 10 * * 1-5"    # 19:00 JST — safety net
  workflow_dispatch:        # lets you run it manually from the Actions tab
    inputs:
      always_post:
        description: "Post the latest available rate even if already posted"
        type: boolean
        default: false

concurrency:
  group: tibor-notify
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit the de-dup state file back

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send TIBOR to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          ALWAYS_POST: ${{ inputs.always_post && '1' || '' }}
          STATE_FILE: state/last_posted.txt
        run: python tibor_bot.py

      - name: Persist de-dup state
        if: ${{ always() }}
        run: |
          if [ -n "$(git status --porcelain state/last_posted.txt)" ]; then
            git config user.name "tibor-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/last_posted.txt
            git commit -m "chore: record last posted TIBOR date [skip ci]"
            git push
            echo "state updated and pushed"
          else
            echo "no state change to commit"
          fi
