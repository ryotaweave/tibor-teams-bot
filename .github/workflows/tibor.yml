name: TIBOR Teams notifier

on:
  schedule:
    # PRIMARY TRIGGER IS NOT HERE: the PC's Task Scheduler task
    # "Bot - TIBOR to Teams" dispatches this workflow at 17:00 JST sharp, which
    # is when the rate page reliably serves the current day's PDF (the file
    # itself is stamped ~14:40–15:15 JST, but the page is cached for a while).
    # GitHub's own cron is best-effort — routinely hours late — so it is kept
    # only as a SAFETY NET for days the PC is off/asleep. Both paths share one
    # de-dup record (state/last_posted.txt), so whichever runs first posts and
    # the rest stay silent: exactly one Teams message per rate.
    # Both slots are AFTER 17:00 JST on purpose, so a punctual cron can never
    # pre-empt the PC's 17:00 post. Times are UTC — JST = UTC + 9h.
    - cron: "23 8 * * 1-5"    # 17:23 JST — safety net if the PC missed 17:00
    - cron: "43 13 * * 1-5"   # 22:43 JST — last chance before JST midnight
  workflow_dispatch:        # lets you run it manually from the Actions tab
    inputs:
      always_post:
        description: "Post the latest available rate even if already posted"
        type: boolean
        default: false

concurrency:
  group: tibor-notify
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit the de-dup state file back

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Phase 1 — fetch, parse, update history, draw the 5-business-day chart.
      - name: Prepare (parse + chart)
        env:
          ALWAYS_POST: ${{ inputs.always_post && '1' || '' }}
          STATE_FILE: state/last_posted.txt
        run: python tibor_bot.py --prepare

      # The chart must be pushed BEFORE the card is sent: Teams fetches the
      # image the moment it renders, so posting first shows a broken image.
      - name: Publish chart & history
        run: |
          if [ -n "$(git status --porcelain charts state/history.csv)" ]; then
            git config user.name "tibor-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add charts state/history.csv
            git commit -m "chore: publish TIBOR chart + history [skip ci]"
            git push
            echo "chart/history published"
          else
            echo "no chart/history change"
          fi

      # Phase 2 — post the card, now that the image URL resolves publicly.
      - name: Send TIBOR to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          ALWAYS_POST: ${{ inputs.always_post && '1' || '' }}
          STATE_FILE: state/last_posted.txt
        run: python tibor_bot.py --post

      - name: Persist de-dup state
        if: ${{ always() }}
        run: |
          if [ -n "$(git status --porcelain state/last_posted.txt)" ]; then
            git config user.name "tibor-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/last_posted.txt
            git commit -m "chore: record last posted TIBOR date [skip ci]"
            git push
            echo "state updated and pushed"
          else
            echo "no state change to commit"
          fi
