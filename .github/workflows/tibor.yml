name: TIBOR Teams notifier

on:
  schedule:
    # The PDF is finalised ~14:00–15:40 JST (observed over many days, latest
    # ~15:39), so ~16:00 JST is the earliest safe target. GitHub's cron is
    # best-effort (often hours late, sometimes dropped) — and schedules on the
    # hour or at :30 are delayed the most, because that's what everyone picks,
    # so these use odd minutes. The script de-dups by rate date, so extra
    # attempts are free and each rate posts exactly once.
    # Times are UTC — JST = UTC + 9h.
    - cron: "7 7 * * 1-5"     # 16:07 JST — primary, just after publication
    - cron: "38 7 * * 1-5"    # 16:38 JST — catch-up
    - cron: "23 8 * * 1-5"    # 17:23 JST — catch-up
    - cron: "51 9 * * 1-5"    # 18:51 JST — catch-up
    - cron: "19 11 * * 1-5"   # 20:19 JST — safety net
    - cron: "43 13 * * 1-5"   # 22:43 JST — last chance before JST midnight
  workflow_dispatch:        # lets you run it manually from the Actions tab
    inputs:
      always_post:
        description: "Post the latest available rate even if already posted"
        type: boolean
        default: false

concurrency:
  group: tibor-notify
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit the de-dup state file back

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send TIBOR to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          ALWAYS_POST: ${{ inputs.always_post && '1' || '' }}
          STATE_FILE: state/last_posted.txt
        run: python tibor_bot.py

      - name: Persist de-dup state
        if: ${{ always() }}
        run: |
          if [ -n "$(git status --porcelain state/last_posted.txt)" ]; then
            git config user.name "tibor-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/last_posted.txt
            git commit -m "chore: record last posted TIBOR date [skip ci]"
            git push
            echo "state updated and pushed"
          else
            echo "no state change to commit"
          fi
